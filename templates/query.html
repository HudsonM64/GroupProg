<h1>Run SQL Query</h1>
<form method="POST">
    <textarea name="query" rows="5" cols="80">{{ query_text }}</textarea><br>
    <button type="submit">Execute</button>
</form>

{% if error %}
    <p style="color:red;">Error: {{ error }}</p>
{% endif %}

{% if result and result is string %}
    <p>{{ result }}</p>
{% elif result %}
    <h2>Result</h2>
    <table border="1">
        <thead>
            <tr>
                {% for col in columns %}
                    <th>{{ col }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in result %}
                <tr>
                    {% for col in columns %}
                        <td>{{ row[col] }}</td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endif %}

<br>
<a href="/">Back</a>
