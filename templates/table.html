<!DOCTYPE html>
<html>
<head>
    <title>{{ table_name }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Viewing Table: {{ table_name }}</h1>

    <form action="" method="get" onsubmit="location.href='/table/' + document.getElementById('tableSelect').value; return false;">
        <label for="tableSelect">Switch Table:</label>
        <select id="tableSelect">
            {% for table in tables %}
                <option value="{{ table }}" {% if table == table_name %}selected{% endif %}>{{ table }}</option>
            {% endfor %}
        </select>
        <button type="submit">Go</button>
    </form>

    <table>
        <thead>
            <tr>
                {% for col in columns %}
                    <th>{{ col }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
                <tr>
                    {% for col in columns %}
                        <td>{{ row[col] }}</td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
